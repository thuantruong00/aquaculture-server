    <!-- ----- ----- sidebar ----- ------->

    <!-- ----- ----- main ----- ------->
    <div class="main">
      <div class="container modal-id ">
        <div class="gap-sm"></div>
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="wrap-title">
              <div class="title">Tạo kịch bản</div>
            </div>
            <div class="my-form #form_id">
              <div class="wrap-my-form">
                <form action="">
                  <label for="name">Tên</label>
                  <div class="gap-xs"></div>
                  <div class="wrap-input required">
                    <input name="name" type="text" required placeholder="Tên" class="w-100">
                  </div>
                  <div class="gap-xs"></div>
                  <div class="wrap-input">
                    <select name="status" required id="status" class="w-50">
                      <option value="s1">active</option>
                      <option value="s2">inactive</option>
                    </select>
                    <label for="status">Trạng thái</label>
                  </div>

                  <label for="status">Nhóm</label>
                  <div class="gap-xs"></div>
                  <div class="wrap-input">
                    <input name="group" type="text" required placeholder="Nhóm / có thể để trống" class="w-100">
                  </div>

                  <div class="gap-sm"></div>
                  <div class="wrap-input">
                    <select name="logic" required id="logic" class="w-50">
                      <option value="s1">Và</option>
                      <option value="s2">Hoặc</option>
                    </select>
                    <label for="logic">Loại Logic</label>
                  </div>
                  <div class="gap-sm"></div>
                  <!-- ====================== -->
                  <div class="condition">
                    <div class="wrap-condition formCondition">
                      <div class="condition-row">
                        <div class="row row-div">
                          <div class="col-5">
                            <label>Thiết bị</label>
                            <div class="gap-xs"></div>
                            <div class="wrap-input">
                              <select name="conditions[][device]" required class="w-100">
                                <option value="s1">Cảm biến 1 - nhiệt độ</option>
                                <option value="s2">Cảm biến 1 - oxy</option>
                              </select>
                            </div>
                          </div>

                          <div class="col-3">
                            <label>So sánh</label>
                            <div class="gap-xs"></div>
                            <div class="wrap-input">
                              <select name="conditions[][operator]" required class="w-100">
                                <option value="gt">&gt; lớn hơn</option>
                                <option value="lt">&lt; bé hơn</option>
                                <option value="eq">= bằng</option>
                              </select>
                            </div>
                          </div>

                          <div class="col-3">
                            <label>Giá trị</label>
                            <div class="gap-xs"></div>
                            <div class="wrap-input required">
                              <input name="conditions[][value]" type="number" step="0.1" min="0" max="100" required placeholder="Giá trị" class="w-100">
                            </div>
                          </div>

                          <div class="col-1 align-content-center">
                            <a href="#" data-condition=".formCondition" class="btn-delete-condition">Xoá</a>
                          </div>
                        </div>

                      </div>

                      <div class="wrap-btn">
                        <div class="gap-xs"></div>
                        <a href="#" onclick="addCondition('.formCondition')" class="btn-add-condition">Thêm +</a>
                      </div>
                    </div>
                  </div>


                  <div class="gap-md"></div>
                  <div class="wrap-input">
                    <select name="action" required id="status" class="w-50">
                      <option value="s1">bơm nước</option>
                      <option value="s2">mở đèn</option>
                    </select>
                    <label for="action">Chọn hành động</label>
                    <div class="gap-sm"></div>
                    <a href="#" class="px-3">Tạo hành động (nếu chưa có)</a>
                  </div>

                  <!-- ====================== -->
                  <div class="submit">
                    <button class="submit-btn">Submit</button>
                  </div>

                </form>
              </div>
            </div>
          </div>
        </div>





      </div>
    </div>
    <!-- ----- ----- main ----- ------->
  </div>

  <!-- Toast container -->
